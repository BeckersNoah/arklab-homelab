# Forward zone — Quad9 over DNS-over-TLS.
#
# forward-first: on a lossy cellular link, full recursion (3–5 independent UDP
# exchanges per cold lookup) turned 5-second loss windows into retry storms that
# tripped Unbound's own per-zone rate limiter. One persistent TLS session absorbs
# the loss with TCP retransmission. Recursion stays as the fallback, and DNSSEC is
# still validated locally — verify with `dig dnssec-failed.org` → SERVFAIL.
# See docs/post-mortems/02-dns-on-a-lossy-5g-link.md
forward-zone:
    name: "."
    forward-first: yes
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
