# Unbound — resolver behind Pi-hole. Reachable only from Pi-hole's private network.
# Config lives outside the repo at runtime; this copy is kept in sync.
# HARD GATE before any restart: unbound-checkconf — a one-character typo in this
# file once cost 15 minutes of external DNS.
server:
    directory: "/opt/unbound/etc/unbound"
    chroot: "/opt/unbound/etc/unbound"
    username: "_unbound"
    interface: 0.0.0.0@5335
    do-daemonize: no
    so-reuseport: yes
    num-threads: 3

    # Module chain. The image default adds `subnetcache` (EDNS Client Subnet):
    # unwanted on a household resolver, and it degrades serve-expired/prefetch.
    module-config: "validator iterator"

    ###########################################################################
    # ACCESS — two independent layers with the compose network isolation
    ###########################################################################
    # Only Pi-hole's private bridge may query. 172.16.0.0/12 was once allowed,
    # which let every Docker network on the host bypass Pi-hole entirely.
    access-control: 127.0.0.1/32 allow       # own healthcheck
    access-control: 172.18.0.0/16 allow

    ###########################################################################
    # DNSSEC + HARDENING
    ###########################################################################
    auto-trust-anchor-file: "var/root.key"
    harden-dnssec-stripped: yes
    harden-algo-downgrade: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    harden-large-queries: yes
    harden-short-bufsize: yes
    harden-unknown-additional: yes
    harden-referral-path: no
    val-clean-additional: yes
    use-caps-for-id: yes
    deny-any: yes
    hide-identity: yes
    hide-version: yes
    identity: "DNS"
    http-user-agent: "DNS"
    qname-minimisation: yes
    aggressive-nsec: yes
    unwanted-reply-threshold: 10000
    ratelimit: 1000
    # DNS rebinding protection
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    # CA bundle for the DoT forward zone
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    ###########################################################################
    # CACHE / PERFORMANCE
    ###########################################################################
    edns-buffer-size: 1232
    cache-min-ttl: 300
    cache-max-ttl: 86400
    msg-cache-size: 128m
    rrset-cache-size: 256m
    neg-cache-size: 4M
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    key-cache-slabs: 4
    infra-cache-slabs: 4
    num-queries-per-thread: 4096
    outgoing-range: 8192
    incoming-num-tcp: 10
    minimal-responses: yes
    rrset-roundrobin: yes
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 3600                  # bound the window a withdrawn record keeps resolving
    serve-expired-client-timeout: 1800
    sock-queue-timeout: 3
    delay-close: 10000
    do-not-query-localhost: no

    ###########################################################################
    # LOGGING — stdout, shipped to Loki
    ###########################################################################
    verbosity: 1
    log-queries: no
    log-replies: no
    log-local-actions: no
    log-servfail: yes
    val-log-level: 2
    ede: yes
    ede-serve-expired: yes
    logfile: ""
    use-syslog: no                           # REQUIRED: defaults to yes and silently overrides logfile

    ###########################################################################
    # INCLUDES — the image dies if any of these is missing
    ###########################################################################
    include: /opt/unbound/etc/unbound/a-records.conf
    include: /opt/unbound/etc/unbound/srv-records.conf
    include: /opt/unbound/etc/unbound/forward-records.conf

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1             # container namespace only
    control-port: 8953
    control-use-cert: no
