server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Docker container logs — labelled by container name
  - job_name: docker-containers
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          host: arklab
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
            tag: attrs.tag
      - regex:
          expression: '(?P<container_name>(?:[^|]*[^|]))'
          source: tag
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
      - labels:
          stream:
          container_name:
      # Defence in depth, not the control: an HTTP client once logged the full
      # bot API URL (token included) six times a minute for weeks. The control is
      # pinning that client's logger to WARNING at import time; this catches the
      # next library that does the same before anyone notices.
      - replace:
          expression: '(bot[0-9]{8,11}:)[A-Za-z0-9_-]{35}'
          replace: '${1}<redacted>'

  # Host logs. Note: sudo argv lands in auth.log and therefore in Loki —
  # never put a secret on a sudo command line.
  - job_name: host-syslog
    static_configs:
      - targets: [localhost]
        labels: {job: syslog, host: arklab, __path__: /var/log/syslog}

  - job_name: host-auth
    static_configs:
      - targets: [localhost]
        labels: {job: auth, host: arklab, __path__: /var/log/auth.log}
